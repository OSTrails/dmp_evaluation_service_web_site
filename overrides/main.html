{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <!-- Expose API base to JS on every page -->
  <meta name="api-base-url" content="{{ config.extra.api_base_url }}">
  <!-- Relative path to the site root, used to build links to the entity detail page -->
  <meta name="site-base" content="{{ base_url }}">
{% endblock %}
